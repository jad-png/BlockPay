services:
  # --- Infrastructure Services ---
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6397:6397"
  # --- Discovery & Config ---
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      retries: 5

  config-service:
    build: ./config-service
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/app/config-repo
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS=file:/app/config-repo/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      eureka-server:
        condition: service_healthy

  # --- Business Services ---
  api-gateway:
    build: ./api-gateway
    ports:
      - "8081:8081"
    environment:
      - SPRING_REDIS_HOST=redis
    depends_on:
      eureka-server:
        condition: service_healthy
      config-service:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-service:8888
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=20
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=2000
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy

  user-service:
    build: ./user-service
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-service:8888
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=20
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=2000
      - SPRING_REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
